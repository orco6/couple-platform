# Local PostgreSQL for development, integration tests and E2E.
#
#   npm run db:up       start (waits until healthy)
#   npm run db:down     stop, keep data
#   docker compose down -v   stop and delete all local data
#
# Three databases, created on first boot by scripts/sql/init-local-databases.sql:
#   bpf_dev    your development data
#   bpf_test   rebuilt by the integration suite on every run
#   bpf_e2e    rebuilt by the Playwright suite on every run
#
# Port 5434 (not 5432/5433) so it cannot collide with another project's
# Postgres on the same machine. Bound to 127.0.0.1 only. The credentials are
# local-only by design and are not secrets.
#
# When cloning the foundation for a new business, rename the container and
# volume (and the database prefix in .env) so two projects never share data.

services:
  postgres:
    image: postgres:17-alpine
    container_name: bpf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bpf
      POSTGRES_PASSWORD: bpf-local-only
      POSTGRES_DB: bpf_dev
      TZ: UTC
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - bpf-pgdata:/var/lib/postgresql/data
      - ./scripts/sql/init-local-databases.sql:/docker-entrypoint-initdb.d/init-local-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpf -d bpf_dev']
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  bpf-pgdata:
